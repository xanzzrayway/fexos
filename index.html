<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fexos AI</title>
<style>
:root{--ink:#000;--blue:#2f6bff;--tint:#e6eeff;--mute:#4f5666;--bw:3px;--glass:rgba(255,255,255,.58);--glass-b:blur(14px) saturate(160%)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,sans-serif;font-weight:500;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
 background:radial-gradient(circle at 12% 8%,#c9d9ff 0,transparent 38%),radial-gradient(circle at 92% 28%,#d9e6ff 0,transparent 34%),radial-gradient(circle at 25% 96%,#dde9ff 0,transparent 40%),#fff;background-attachment:fixed}
button{font-family:inherit;color:inherit;user-select:none;-webkit-user-select:none;outline:none}
button:focus{outline:none}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
textarea:focus,textarea:focus-visible{outline:none}
::selection{background:#000;color:#fff}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--glass-b);backdrop-filter:var(--glass-b)}

header{padding:14px 18px;border-bottom:var(--bw) solid var(--ink);background:var(--glass);-webkit-backdrop-filter:var(--glass-b);backdrop-filter:var(--glass-b);position:relative;z-index:2}
header h1{font-size:22px;font-weight:900;letter-spacing:-.4px;line-height:1.1}
header small{display:block;color:var(--mute);font-size:12px;font-weight:700;line-height:1.3}

#chat{flex:1;overflow-y:auto;padding:22px 14px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;max-width:100%}
.msg.user{justify-content:flex-end}
.bub{min-width:0;overflow-wrap:anywhere}
.user .bub{background:var(--blue);color:#fff;border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:9px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;font-weight:600}
.bot .bub{flex:1;background:var(--glass);-webkit-backdrop-filter:var(--glass-b);backdrop-filter:var(--glass-b);border:var(--bw) solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px;border-radius:14px}
.bub p{margin:0 0 .7em}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:0 0 .7em 1.3em}
.bub code{background:rgba(230,238,255,.8);border:1.5px solid var(--ink);padding:0 5px;border-radius:5px;font:600 13px Consolas,monospace}
.bub pre{background:rgba(255,255,255,.7);border:var(--bw) solid var(--ink);border-radius:10px;margin:.6em 0;overflow:hidden}
.bub pre .top{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:var(--bw) solid var(--ink);background:var(--blue);color:#fff;font-size:12px;font-weight:800}
.bub pre .top button{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:0 8px;font-size:12px;font-weight:800;cursor:pointer}
.bub pre .top button:active{transform:translate(1px,1px)}
.bub pre code{display:block;padding:12px;overflow-x:auto;background:none;border:0;border-radius:0;white-space:pre;font-weight:500}
.dots span{display:inline-block;width:9px;height:9px;margin-right:5px;border:2px solid var(--ink);background:var(--blue);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.err{color:#d4002a;font-weight:800}

.hero{text-align:center;margin:14vh auto 0;max-width:520px}
.hero h2{font-size:32px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px}
.hero p{color:var(--mute);font-weight:600;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips button{cursor:pointer;background:var(--glass);-webkit-backdrop-filter:var(--glass-b);backdrop-filter:var(--glass-b);border:var(--bw) solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800;transition:transform .08s,box-shadow .08s}
.chips button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

footer{padding:8px 14px 12px}
.box{max-width:760px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:var(--glass-b);backdrop-filter:var(--glass-b);border:var(--bw) solid var(--ink);border-radius:30px;box-shadow:5px 5px 0 var(--ink);padding:14px 12px 12px 18px}
textarea{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;font-weight:600;resize:none;max-height:160px;padding:2px 0 12px;display:block}
textarea::placeholder{color:#6b7283}
.row{display:flex;align-items:center;gap:10px}
.row .sp{flex:1}
.round,.pill{cursor:pointer;border:var(--bw) solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.round{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;font-weight:900;display:grid;place-items:center;padding:0}
.round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round.light{background:rgba(255,255,255,.75);color:var(--ink)}
.round.rec{background:#ff3b5c;color:#fff}
.pill{height:44px;padding:0 14px 0 18px;border-radius:999px;background:rgba(230,238,255,.75);font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.round:active:not(:disabled),.pill:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.round:disabled{opacity:.45;cursor:not-allowed}
.note{text-align:center;color:var(--mute);font-size:11px;font-weight:700;margin-top:10px}

/* Panel pilih model */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:760px;margin:0 auto;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.open{transform:translateY(0)}
.grab{width:46px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:900;margin-bottom:12px}
.opt{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.8);border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:10px 14px;margin-bottom:12px;transition:transform .08s,box-shadow .08s}
.opt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.opt .t{flex:1}
.opt b{display:block;font-size:15px;font-weight:900;line-height:1.3}
.opt span{display:block;font-size:12px;font-weight:600;color:var(--mute);line-height:1.3}
.opt .ck{width:26px;height:26px;border:var(--bw) solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.opt.sel{background:var(--tint)}
.opt.sel .ck{background:var(--blue)}
.opt.sel .ck:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Fexos AI</h1>
  <small id="model"></small>
</header>

<main id="chat"><div class="wrap" id="list"></div></main>

<footer>
  <div class="box">
    <textarea id="input" rows="1" placeholder="Balas Fexos AI"></textarea>
    <div class="row">
      <button class="round" id="clear" aria-label="Chat baru" title="Chat baru">+</button>
      <button class="pill" id="pill" aria-label="Pilih model"><span id="pillName"></span><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="sp"></div>
      <button class="round light" id="mic" aria-label="Bicara" title="Bicara"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="round" id="send" aria-label="Kirim" title="Kirim"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <div class="note">Fexos AI bisa salah. Cek ulang info penting.</div>
</footer>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Pilih model">
  <div class="grab"></div>
  <h3>Pilih model</h3>
  <div id="models"></div>
</div>

<script>
/* ====== KONFIGURASI (API key ada di Cloudflare: GEMINI_API_KEY) ====== */
const CONFIG = {
  MODELS: [
    {id:"gemini-2.5-flash",      name:"Fexos Flash",    desc:"Cepat dan seimbang untuk sehari-hari"},
    {id:"gemini-2.5-pro",        name:"Fexos Pro",      desc:"Paling pintar, cocok untuk kode dan analisis"},
    {id:"gemini-2.5-flash-lite", name:"Fexos Lite",     desc:"Paling ringan dan hemat kuota"},
    {id:"gemini-2.0-flash",      name:"Fexos Classic",  desc:"Versi stabil yang sudah teruji"}
  ],
};
/* ========================= */

const $ = s => document.querySelector(s);
const list = $("#list"), chat = $("#chat"), input = $("#input"), sendBtn = $("#send"), micBtn = $("#mic");
let convo = [], busy = false, current = CONFIG.MODELS[0];
try{ const s = localStorage.getItem("fexos_model"); const f = CONFIG.MODELS.find(m=>m.id===s); if(f) current = f; }catch(e){}

function showModel(){ $("#pillName").textContent = current.name; $("#model").textContent = current.id; }
function renderModels(){
  $("#models").innerHTML = CONFIG.MODELS.map(m=>`<button class="opt${m.id===current.id?" sel":""}" data-id="${m.id}"><div class="t"><b>${m.name}</b><span>${m.desc}</span></div><div class="ck"></div></button>`).join("");
}
function sheet(open){
  $("#sheet").classList.toggle("open",open);
  $("#scrim").classList.toggle("open",open);
}
$("#pill").onclick = () => { renderModels(); sheet(true); };
$("#scrim").onclick = () => sheet(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") sheet(false); });
$("#models").onclick = e => {
  const b = e.target.closest(".opt"); if(!b) return;
  current = CONFIG.MODELS.find(m=>m.id===b.dataset.id);
  try{ localStorage.setItem("fexos_model",current.id); }catch(err){}
  showModel(); renderModels();
  setTimeout(()=>sheet(false),180);
};
showModel();

const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function md(text){
  const blocks = [];
  text = esc(text).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,lang,code)=>{
    blocks.push(`<pre><div class="top"><span>${lang||"kode"}</span><button data-copy>Salin</button></div><code>${code.replace(/\n$/,"")}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const out = text.split(/\n{2,}/).map(par=>{
    const lines = par.split("\n");
    if(lines.every(l=>/^\s*[-*] /.test(l))) return "<ul>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*[-*] /,""))+"</li>").join("")+"</ul>";
    if(lines.every(l=>/^\s*\d+\. /.test(l))) return "<ol>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*\d+\. /,""))+"</li>").join("")+"</ol>";
    return "<p>"+inline(par).replace(/\n/g,"<br>")+"</p>";
  }).join("");
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]).replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g,"$1");
}
function inline(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*([^*\n]+)\*/g,"$1<i>$2</i>");
}

function hero(){
  list.innerHTML = `<div class="hero"><h2>Halo, aku Fexos AI</h2><p>Tanya, minta bantuan kode, atau ngobrol santai.</p>
  <div class="chips">
    <button>Jelaskan cara kerja API</button>
    <button>Buatkan kode tombol animasi CSS</button>
    <button>Kasih ide nama brand teknologi</button>
  </div></div>`;
  list.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});
}

function addMsg(role){
  const el = document.createElement("div");
  el.className = "msg "+(role==="user"?"user":"bot");
  el.innerHTML = '<div class="bub"></div>';
  list.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el.querySelector(".bub");
}

async function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  if(!convo.length) list.innerHTML = "";
  busy = true; sendBtn.disabled = true;
  input.value = ""; input.style.height = "auto";

  addMsg("user").textContent = text;
  convo.push({role:"user",parts:[{text}]});
  const bub = addMsg("bot");
  bub.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

  let full = "";
  try{
    const res = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:current.id,contents:convo})
    });
    if(!res.ok){
      let msg = res.status+" "+res.statusText;
      try{ msg = (await res.json()).error.message }catch(e){ if(res.status===404) msg = "Backend /api/chat tidak ditemukan. Pastikan _worker.js ikut terupload ke Cloudflare Pages."; }
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while(true){
      const {value,done} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for(const l of lines){
        if(!l.startsWith("data:")) continue;
        try{
          const j = JSON.parse(l.slice(5));
          const t = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
          if(t){ full += t; bub.innerHTML = md(full); chat.scrollTop = chat.scrollHeight; }
        }catch(e){}
      }
    }
    if(!full) throw new Error("Respons kosong (mungkin diblokir filter keamanan). Coba ubah pertanyaan.");
    convo.push({role:"model",parts:[{text:full}]});
  }catch(err){
    convo.pop();
    bub.innerHTML = `<span class="err">Gagal: ${esc(err.message)}</span>`;
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

/* Mic: suara -> teks */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
micBtn.onclick = () => {
  if(!SR){ alert("Browser ini belum mendukung input suara."); return; }
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = "id-ID"; rec.interimResults = true;
  const base = input.value ? input.value + " " : "";
  micBtn.classList.add("rec");
  rec.onresult = e => { input.value = base + Array.from(e.results).map(r=>r[0].transcript).join(""); input.dispatchEvent(new Event("input")); };
  rec.onend = rec.onerror = () => { micBtn.classList.remove("rec"); rec = null; };
  rec.start();
};

list.addEventListener("click",e=>{
  if(e.target.dataset.copy!==undefined){
    const code = e.target.closest("pre").querySelector("code").innerText;
    navigator.clipboard.writeText(code).then(()=>{e.target.textContent="Tersalin";setTimeout(()=>e.target.textContent="Salin",1200)});
  }
});
sendBtn.onclick = send;
input.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); send(); }});
input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,160)+"px"; });
$("#clear").onclick = ()=>{ if(busy) return; convo=[]; hero(); };
hero();
</script>
</body>
</html>
